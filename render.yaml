services:
  - type: web
    name: pitchline-api
    runtime: go
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: OTP_TTL_SECONDS
        value: "300"
      - key: OTP_DELIVERY
        value: "sms"
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_SMS_SENDER_ID
        sync: false
      - key: AT_ENV
        value: "production"
